<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Resolves and applies the initial light/dark theme (see src/theme/theme.ts's
      module doc) before any stylesheet paints — a plain classic script, not
      type="module", so it blocks parsing and runs synchronously right here, avoiding
      a flash of the wrong theme. Must stay in sync with theme.ts's own resolution
      order ("stored" localStorage key, else prefers-color-scheme, else 'light' — this
      design import is light-themed, unlike the app's pre-revamp dark-first default)
      since a module import here would run too late to matter for first paint.
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'tckr-theme';
        var theme = 'light';
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {
          // Storage/matchMedia unavailable — fall back to the light default above.
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>Tckr MarketWatch</title>
    <meta
      name="description"
      content="Tckr MarketWatch — a simulated Egyptian Exchange (EGX) market-watch terminal with live price charts, LIVE/DELAYED entitlement badges, and trading-calendar-aware data."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
